<text x="945" y="546.7" font-size="12" fill="#495057" text-anchor="middle">slot 0 to 4</text>
<rect x="909.76" y="673" width="70.48" height="19" fill="#ffffff"/>
<text x="945" y="686.7" font-size="12" fill="#495057" text-anchor="middle">one match</text>
<rect x="879.52" y="813" width="130.96" height="19" fill="#ffffff"/>
<text x="945" y="826.7" font-size="12" fill="#495057" text-anchor="middle">if a match is near</text>
<text x="16" y="140.45" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">Every day</tspan></text>
<text x="16" y="166.55" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">two cron triggers</tspan></text>
<text x="16" y="240.45" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">Friday to Monday</tspan></text>
<text x="16" y="266.55" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">one cron trigger</tspan></text>
<text x="16" y="340.45" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">Tuesday to Thursday</tspan></text>
<text x="16" y="366.55" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">one cron trigger</tspan></text>
<text x="612" y="151.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="612" dy="0">&#160;</tspan></text>
<text x="719" y="140.45" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="719" dy="0">archive</tspan></text>
<text x="719" y="166.55" font-size="14" fill="#495057" text-anchor="middle"><tspan x="719" dy="0">06:25 to 09:55</tspan></text>
<text x="1592" y="151.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="1592" dy="0">&#160;</tspan></text>
<text x="1212" y="240.45" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1212" dy="0">poller, every 5 minutes</tspan></text>
<text x="1212" y="266.55" font-size="14" fill="#495057" text-anchor="middle"><tspan x="1212" dy="0">11:00 to 22:55</tspan></text>
<text x="1380" y="340.45" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1380" dy="0">poller, every 5 minutes</tspan></text>
<text x="1380" y="366.55" font-size="14" fill="#495057" text-anchor="middle"><tspan x="1380" dy="0">17:00 to 22:55</tspan></text>
<text x="16" y="528.25" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">*/5 11-22 * * FRI,SAT,SUN,MON</tspan></text>
<text x="16" y="554.05" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">matchday cron, Friday to Monday</tspan></text>
<text x="16" y="618.25" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">*/5 17-22 * * TUE,WED,THU</tspan></text>
<text x="16" y="644.05" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">matchday cron, Tuesday to Thursday</tspan></text>
<text x="16" y="708.25" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">*/5 6-9 * * *</tspan></text>
<text x="16" y="734.05" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">MORNING_CRON, every day</tspan></text>
<text x="16" y="798.25" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="16" dy="0">30,35,40,45,50 23 * * *</tspan></text>
<text x="16" y="824.05" font-size="14" fill="#495057" text-anchor="start"><tspan x="16" dy="0">NIGHT_SYNC_CRON, every day</tspan></text>
<text x="536" y="531.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="536" dy="0">routeScheduled(cron, time)</tspan></text>
<text x="536" y="557.8" font-size="14" fill="#495057" text-anchor="start"><tspan x="536" dy="0">Reads the cron text and the time.</tspan><tspan x="536" dy="17.5">&#160;</tspan><tspan x="536" dy="17.5">night cron → sync</tspan><tspan x="536" dy="17.5">morning cron, before 06:25 → sync</tspan><tspan x="536" dy="17.5">morning cron, after that → archive</tspan><tspan x="536" dy="17.5">any other cron → poll</tspan><tspan x="536" dy="17.5">&#160;</tspan><tspan x="536" dy="17.5">For a sync, the minute picks the</tspan><tspan x="536" dy="17.5">league: 0, 5, 10, 15, 20 → slot 0 to 4</tspan><tspan x="536" dy="17.5">&#160;</tspan><tspan x="536" dy="17.5">schedule.ts keeps these strings equal</tspan><tspan x="536" dy="17.5">to the ones in wrangler.jsonc</tspan></text>
<text x="1056" y="531.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="1056" dy="0">sync: runSync(slot)</tspan></text>
<text x="1056" y="557.8" font-size="14" fill="#495057" text-anchor="start"><tspan x="1056" dy="0">slot 0 to 4 = PL, PD, FL1, BL1, CL</tspan><tspan x="1056" dy="17.5">fixtures: 7 days back, 14 ahead</tspan><tspan x="1056" dy="17.5">plus that league's table (2 requests)</tspan></text>
<text x="1056" y="671.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="1056" dy="0">archive: runArchive</tspan></text>
<text x="1056" y="697.8" font-size="14" fill="#495057" text-anchor="start"><tspan x="1056" dy="0">one finished match fetched by id</tspan><tspan x="1056" dy="17.5">stops at 50 requests used today</tspan><tspan x="1056" dy="17.5">(20 on Friday to Monday)</tspan></text>
<text x="1056" y="811.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="1056" dy="0">poll: runPoller</tspan></text>
<text x="1056" y="837.8" font-size="14" fill="#495057" text-anchor="start"><tspan x="1056" dy="0">asks if any tracked match is near</tspan><tspan x="1056" dy="17.5">live scores, events, alerts</tspan><tspan x="1056" dy="17.5">next: diagram 4</tspan></text>
<text x="0" y="17.099999999999998" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="0" dy="0">Cron timeline: when the Worker wakes up on its own (one day, all times UTC)</tspan></text>
