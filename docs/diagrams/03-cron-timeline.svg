<text x="1448" y="191.4" font-size="12" fill="#495057" text-anchor="start"><tspan x="1448" dy="0">23:30 to 23:50: sync</tspan></text>
<text x="260" y="412.35" font-size="13" fill="#495057" text-anchor="start"><tspan x="260" dy="0">Empty space is quiet time: nothing runs, so no request is made and Neon is not woken by a cron.</tspan></text>
<text x="0" y="467.1" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="0" dy="0">How the Worker decides what a run does (server/src/schedule.ts)</tspan></text>
<text x="0" y="942.35" font-size="13" fill="#495057" text-anchor="start"><tspan x="0" dy="0">A cron run is not a request: nobody waits for an answer. A run that finds nothing to do ends without calling a provider.</tspan><tspan x="0" dy="16.25">Colours: blue = sync, purple = archive, green = poll. Each arrow on the right is one job; the left shows the four triggers in wrangler.jsonc.</tspan></text>
